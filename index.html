<style>
[hidden]{display:none!important}
:root{--ink:#2b1d16;--paper:#f8f2e4;--shu:#c4402a;--shu2:#9c2e1d;--night:#18223a;--gold:#e8b44c;
  --min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;--brush:"Yuji Syuku","Shippori Mincho B1","Hiragino Mincho ProN",serif;--sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--night)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--sans);color:var(--ink);overflow:hidden;height:100svh;background:var(--night)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
input{font:inherit;-webkit-user-select:text;user-select:text}
.view{position:fixed;inset:0;height:100svh;overflow:hidden;z-index:2}
.wrap{position:relative;height:100%;max-width:480px;margin:0 auto}
#scene{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#leaves{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#leaves i{position:absolute;top:-20px;width:11px;height:11px;background:#d9653a;border-radius:0 70% 0 70%;opacity:.75;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-60px,105svh) rotate(540deg)}}
#loading{position:fixed;inset:0;z-index:90;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
#loading svg{width:84px;height:130px;animation:rattle .5s ease-in-out infinite;transform-origin:50% 30%}
@keyframes rattle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(3px)}}
#loading p{font-family:var(--min);font-size:15px;color:#f3e6cc;letter-spacing:.12em}
#loadBar{width:150px;height:4px;background:rgba(255,255,255,.14);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--shu);transition:width .2s}
#corner{position:fixed;top:max(6px,env(safe-area-inset-top));right:6px;z-index:60;display:flex;gap:6px}
#corner button{min-width:42px;height:42px;border-radius:21px;background:rgba(16,20,34,.55);color:#f3e6cc;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 10px}
#corner svg{width:20px;height:20px;fill:#f3e6cc}

/* タイトル */
#vTitle .wrap{display:flex;flex-direction:column;align-items:center;padding:calc(56px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.tMid{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:5vw}
.tSlip{position:relative;height:min(52svh,380px);aspect-ratio:1/2.4;background:var(--paper);box-shadow:0 14px 30px rgba(0,0,0,.45);transform:rotate(-2deg);padding:10% 0;display:flex;flex-direction:column;align-items:center;outline:2px solid var(--shu);outline-offset:-9px}
.tSlip::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:40px;background:#e9dcc0;transform:translateX(-50%)}
.tSlip h1{writing-mode:vertical-rl;white-space:nowrap;font-family:var(--brush);font-weight:400;font-size:min(13vw,8.4svh,58px);line-height:1;letter-spacing:.1em;color:var(--shu)}
.tSlip small{writing-mode:vertical-rl;white-space:nowrap;margin-top:auto;font-family:var(--min);font-weight:600;font-size:12px;color:#6d5a44}
.tSlip.en{aspect-ratio:auto;width:min(58vw,240px);height:auto;padding:26px 14px}
.tSlip.en h1{writing-mode:horizontal-tb;font-family:var(--min);font-weight:800;font-size:min(9vw,38px);text-align:center;line-height:1.1}
.tSlip.en small{display:none}
.tBox{width:min(30vw,120px);align-self:flex-end;margin-bottom:6svh;animation:idleRock 2.4s ease-in-out infinite;transform-origin:50% 20%}
@keyframes idleRock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.tBox svg{width:100%;display:block}
#tSub{font-family:var(--min);font-weight:600;color:#f6e7c8;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.6);margin:10px 0 12px;text-align:center}
.big{width:min(78vw,300px);min-height:56px;border-radius:4px;background:var(--shu);color:#fff6e6;font-family:var(--min);font-weight:800;font-size:20px;letter-spacing:.1em;box-shadow:0 5px 0 var(--shu2),0 10px 22px rgba(0,0,0,.4)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shu2)}
.big:disabled{background:#7d6a5a;box-shadow:0 5px 0 #4a3d33;color:#d9cbb6}
.tLinks{display:flex;gap:22px;margin-top:6px}
.tLinks button{min-height:44px;padding:0 6px;color:#f3e6cc;font-family:var(--min);font-weight:600;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#tToday{font-size:12px;color:#d9c6a2;min-height:16px}

/* 名前と状況（社務所の申込み紙） */
#vAsk .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(56px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.form{width:min(100%,380px);background:var(--paper);padding:18px 16px 16px;box-shadow:0 12px 26px rgba(0,0,0,.45);outline:2px solid var(--shu);outline-offset:-7px;display:flex;flex-direction:column;gap:8px}
.form label,.form .lab{font-family:var(--min);font-weight:800;font-size:15px;color:var(--shu)}
#name{width:100%;height:46px;border:0;border-bottom:2px solid #8a7458;background:transparent;font-family:var(--min);font-weight:800;font-size:20px;color:var(--ink);padding:0 4px;border-radius:0;outline:none}
#name::placeholder{color:#b3a38b;font-weight:600;font-size:16px}
#nameNote{font-size:11px;color:#7a6550;margin-top:-2px}
#sits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.sit{min-height:48px;background:linear-gradient(#d8b07c,#c19461);clip-path:polygon(50% 0,100% 22%,100% 100%,0 100%,0 22%);padding-top:10px;font-family:var(--min);font-weight:800;font-size:15px;color:var(--ink)}
.sit.on{background:linear-gradient(#c4402a,#9c2e1d);color:#fff6e6}

/* 儀式 */
#vPlay .wrap{display:flex;flex-direction:column}
#hint{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%) rotate(-1.2deg);z-index:6;background:#f6edd8;color:var(--ink);font-family:var(--min);font-weight:800;font-size:15px;padding:7px 14px 8px;border-left:4px solid var(--shu);box-shadow:0 3px 8px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none}
#stage{position:absolute;left:0;right:0;top:calc(110px + env(safe-area-inset-top));bottom:0}
#counter{position:absolute;left:-50vw;right:-50vw;bottom:0;height:calc(16% + env(safe-area-inset-bottom));background:linear-gradient(#8a5a35,#6b4226 30%,#53321b);box-shadow:0 -3px 8px rgba(0,0,0,.35)}
#counter::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:#a46d43}
#boxArt{position:absolute;z-index:3;left:50%;top:0;height:52%;aspect-ratio:160/250;transform:translateX(-50%);transform-origin:50% 25%;pointer-events:none}
#boxArt svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#boxArt.shL{animation:shL .26s ease-out}#boxArt.shR{animation:shR .26s ease-out}
@keyframes shL{40%{transform:translateX(-50%) rotate(-14deg) translateY(5px)}}
@keyframes shR{40%{transform:translateX(-50%) rotate(14deg) translateY(5px)}}
#boxArt.nope{animation:nope .4s}
@keyframes nope{20%{transform:translateX(-46%)}40%{transform:translateX(-54%)}60%{transform:translateX(-48%)}}
#boxBtn{position:absolute;left:50%;top:0;width:min(60vw,240px);height:52%;transform:translateX(-50%);z-index:4}
#prog{position:absolute;left:calc(50% + min(18vw,80px));top:12%;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:4}
#prog i{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,230,180,.6)}
#prog i.on{background:#f3d79a}
#stickWrap{position:absolute;left:50%;top:44%;width:110px;height:34%;transform:translateX(-50%);z-index:5;display:flex;justify-content:center;pointer-events:none}
#stick{position:relative;width:110px;height:100%;pointer-events:none;transform:translateY(-45%);transition:transform .2s ease-out,opacity .12s;opacity:0}
#stick.out{transform:none;opacity:1;pointer-events:auto}
#stick svg{position:relative;height:100%;width:auto;display:block;margin:0 auto;z-index:1}
#halo{position:absolute;left:50%;top:55%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:radial-gradient(circle,rgba(255,232,150,.95) 0,rgba(255,196,90,.55) 32%,rgba(255,170,60,0) 68%);opacity:var(--g,0);transform:scale(calc(.5 + var(--g,0) * .65));pointer-events:none}
#folded{position:absolute;left:50%;top:58%;width:70px;height:108px;margin-left:-35px;background:linear-gradient(115deg,#fbf6ea 0 48%,#e6dcc6 48% 52%,#f4ecda 52%);box-shadow:0 8px 16px rgba(0,0,0,.45);transform:rotate(-8deg);z-index:7;animation:drop .35s ease-out}
#folded::before{content:"";position:absolute;inset:-24px}
#folded::after{content:"";position:absolute;left:0;right:0;top:44%;height:10px;background:var(--shu)}
@keyframes drop{0%{transform:translateY(-80px) rotate(20deg) scale(.4)}100%{transform:rotate(-8deg)}}
#folded.pulse{animation:fpulse 1.2s ease-in-out infinite}
@keyframes fpulse{50%{transform:rotate(-4deg) scale(1.06)}}
#priest{position:absolute;bottom:14%;left:-4%;height:42%;z-index:6;pointer-events:none;transform:translateX(-95%);transition:transform .3s ease-out}
#priest.out{transform:translateX(0)}
#priest svg{display:block;height:100%;width:auto;filter:drop-shadow(1.4px 0 0 #2b1d16) drop-shadow(-1.4px 0 0 #2b1d16) drop-shadow(0 1.4px 0 #2b1d16) drop-shadow(0 -1.4px 0 #2b1d16) drop-shadow(0 6px 6px rgba(0,0,0,.35))}
#bubble{position:fixed;z-index:12;max-width:70%;background:#fffaf0;border:2px solid var(--ink);border-radius:14px;padding:5px 12px;font-family:var(--min);font-weight:800;font-size:15px;line-height:1.3;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
#bubble.on{opacity:1}
#finger{position:fixed;z-index:13;width:40px;height:40px;pointer-events:none;animation:poke .8s ease-in-out infinite}
@keyframes poke{50%{transform:translate(4px,8px) scale(.92)}}

/* 結果（一枚の紙） */
#vEnd .wrap{display:flex;flex-direction:column;align-items:center;gap:7px;padding:calc(54px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom))}
#slipBox{flex:1;min-height:0;width:100%;display:flex;align-items:stretch;justify-content:center;position:relative}
#slip{position:relative;height:100%;width:min(100%,430px);background:var(--paper);box-shadow:0 12px 28px rgba(0,0,0,.5);padding:.9em .8em;display:flex;flex-direction:column;gap:.5em;outline:2px solid var(--shu);outline-offset:-6px;overflow:hidden;font-size:16px;transform-origin:50% 0}
#slip::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(8deg,rgba(120,90,50,.035) 0 2px,transparent 2px 6px)}
#slip.in{animation:unfold .45s ease-out}
@keyframes unfold{0%{transform:scaleY(.12) rotate(-3deg);opacity:.3}100%{transform:none;opacity:1}}
#slip .top,#slip .bot{writing-mode:vertical-rl;display:flex;flex-direction:column;gap:.5em;min-height:0}
#slip .top{flex:0 0 46%}
#slip .top>*,#slip .bot>*{flex-shrink:0}
#slip .bot{flex:1;border-top:1.5px solid rgba(196,64,42,.5);padding-top:.5em}
#slip .sHead{display:flex;flex-direction:column;align-items:flex-start;gap:.3em;padding-left:.4em;border-left:1.5px solid rgba(196,64,42,.5)}
#slip .sNo{font-family:var(--min);font-weight:600;font-size:.72em;color:#6d5a44}
#slip .sRank{font-family:var(--brush);font-weight:400;font-size:2.9em;line-height:1;color:var(--shu)}
#slip .sName{font-family:var(--min);font-weight:800;font-size:.9em;color:#6d5a44}
#slip .sWaka{font-family:var(--brush);font-size:1.05em;line-height:1.7;color:var(--ink);padding:0 .2em}
#slip .sWaka .lo{padding-top:2.2em}
#slip .sSo,#slip .sItems p{font-family:var(--min);font-weight:800;font-size:.95em;line-height:1.6;color:var(--ink)}
#slip .sSo{border-left:1.5px solid rgba(196,64,42,.35);border-right:1.5px solid rgba(196,64,42,.35);padding:0 .35em}
#slip b.l{display:inline-block;font-weight:800;color:#fff8ec;background:var(--shu);padding:.25em .05em;margin-bottom:.4em;line-height:1.2}
#slip .tcy{text-combine-upright:all;-webkit-text-combine:horizontal}
#slip .stamp{position:absolute;left:.7em;bottom:.7em;writing-mode:horizontal-tb;width:2.6em;height:2.6em;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font-family:var(--brush);font-size:1em;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);background:rgba(248,242,228,.85)}
#slip.kyo .sRank{color:#2b3a55}
#slip.en{gap:.45em;padding:1em 1.1em}
#slip.en .top,#slip.en .bot{writing-mode:horizontal-tb;flex:none;border:0;padding:0;gap:.45em}
#slip.en .sHead{flex-direction:row;align-items:baseline;gap:.6em;padding:0 0 .4em;border-left:0;border-bottom:1.5px solid rgba(196,64,42,.5)}
#slip.en .sRank{font-family:var(--min);font-weight:800;font-size:1.7em}
#slip.en .sWaka{font-family:var(--min);font-style:italic;font-size:.95em;line-height:1.4}
#slip.en .sSo{border:0;border-top:1.5px solid rgba(196,64,42,.35);border-bottom:1.5px solid rgba(196,64,42,.35);padding:.3em 0}
#slip.en b.l{margin:0 .5em 0 0;padding:.05em .4em}
#slip.en .stamp{left:auto;right:.8em;bottom:.8em}
#slip.tied{animation:tieA .9s ease-in-out}
@keyframes tieA{40%{transform:translateY(-6%) scale(.9) rotate(4deg)}100%{transform:none}}
#knot{position:absolute;left:50%;top:-6px;width:72px;height:26px;margin-left:-36px;z-index:3;pointer-events:none}
#ritualNote{flex:none;font-family:var(--min);font-weight:800;font-size:13px;color:#f3e6cc;text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:center;min-height:17px}
.endBtns{flex:none;display:flex;flex-direction:column;gap:6px;width:min(100%,380px)}
.endBtns .row{display:flex;gap:6px}
.endBtns .row button{flex:1;min-height:42px;border-radius:4px;font-family:var(--min);font-weight:800;font-size:14px;background:rgba(16,20,34,.6);color:#f3e6cc;border:1px solid rgba(243,230,204,.5)}
.endBtns .row button.hot{background:var(--shu);border-color:var(--shu);color:#fff6e6}
#bAgain{flex:1;min-height:46px;font-size:17px}
.endBtns .row #bAgain{background:var(--shu);border:0;color:#fff6e6;box-shadow:0 4px 0 var(--shu2)}
.endBtns .row #bAgain:disabled{background:#5d5048;box-shadow:none;color:#cdbb98}
#bGreed{align-self:center;min-height:32px;padding:0 10px;font-size:12px;color:#d9c6a2;text-decoration:underline;text-underline-offset:3px}
#affBox{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
#bAff{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;max-width:100%;padding:0 14px;border-radius:4px;border:1px solid rgba(243,230,204,.45);color:#f3e6cc;font-size:14px;font-weight:700;text-decoration:none;line-height:1.25;background:rgba(16,20,34,.5)}
#bAff .pr{flex:none;font-size:13px;font-weight:700;border:1.5px solid #f3e6cc;border-radius:3px;padding:0 5px;line-height:1.45}
#affNote{font-size:11px;color:#cdbb98}
#card{display:none}
#slip .top{flex-basis:48%}
#slip:not(.en) .sWaka{font-size:.86em}
#slip:not(.en) .sWaka p span{white-space:nowrap;display:inline-block}
#slip:not(.en) .sWaka .lo{padding-top:1.8em}

.ovl{position:fixed;inset:0;z-index:70;background:#10141f;display:flex;flex-direction:column;padding:calc(54px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));color:#f3e6cc}
.ovl .in{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
.ovl h2{font-family:var(--min);font-weight:800;font-size:20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.ovl h2 span{font-size:13px;font-weight:600;color:#cdbb98}
#grid{flex:none;display:grid;grid-template-columns:5.5em repeat(6,1fr);gap:4px;font-family:var(--min);font-weight:800;font-size:12px}
#grid .h{display:flex;align-items:center;justify-content:center;color:#cdbb98;min-height:28px}
#grid .r{display:flex;align-items:center;color:#f3e6cc;min-height:40px;line-height:1.2}
#grid .c{display:flex;align-items:center;justify-content:center;min-height:40px;background:rgba(243,234,214,.08);border-radius:2px;color:transparent}
#grid .c.on{background:#f3ead6;color:var(--shu);font-family:var(--brush);font-size:16px}
#bookInfo{margin-top:12px;font-size:13px;line-height:1.6;color:#cdbb98}
#howBody{flex:1;min-height:0;overflow:hidden;font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:12px}
#howBody b{color:var(--gold)}
#howBody small{font-size:11px;line-height:1.5;color:#b8a888;margin-top:auto}
#howBody a{color:#cfe0f0}
.ovl .close{flex:none;margin-top:auto;min-height:46px;border-radius:4px;background:#f3e6cc;color:var(--ink);font-family:var(--min);font-weight:800;font-size:16px}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c31"/><stop offset=".38" stop-color="#2b3a5a"/><stop offset=".62" stop-color="#7d5a4e"/><stop offset=".8" stop-color="#d98c55"/><stop offset="1" stop-color="#f0bd78"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe2b0"/><stop offset=".4" stop-color="#ffc47a" stop-opacity=".8"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3f3c"/><stop offset="1" stop-color="#231d1d"/></linearGradient>
    <linearGradient id="pil" x1="0" x2="1"><stop offset="0" stop-color="#8f2f1f"/><stop offset=".45" stop-color="#c4492f"/><stop offset="1" stop-color="#7d2618"/></linearGradient>
  </defs>
  <rect width="400" height="800" fill="url(#sky)"/>
  <circle cx="290" cy="560" r="120" fill="url(#sun)"/>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,input')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  // 読み込み中を失敗と出さない: JS が動いたか（__jsUp）で見る
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
