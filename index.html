<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>恋みくじ連打（45秒で引けるだけ引く）</title>
<meta name="description" content="夕暮れの神社で、閉門まで45秒。六角の箱を振って恋みくじを引きまくる。光った瞬間に抜けば大吉、振りすぎると詰まって神主さんに止められる。凶を結ばずに振ると元恋人が来る。全50枚の恋みくじ図鑑。">
<meta property="og:type" content="website">
<meta property="og:title" content="恋みくじ連打">
<meta property="og:description" content="閉門まで45秒、恋みくじを引けるだけ引く。光った瞬間に抜けば大吉。凶を結ばずに振ると元恋人が来る。待ち人、来ず。むしろ去る。">
<meta property="og:image" content="https://tom3games.github.io/koi-mikuji/og.png">
<meta property="og:url" content="https://tom3games.github.io/koi-mikuji/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#18223a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#2b1d16;--paper:#f8f2e4;--shu:#c4402a;--shu2:#9c2e1d;--wood:#a8754a;--wood2:#6e4524;--night:#18223a;--gold:#e8b44c;--asagi:#6d9fb0;
  --min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;--brush:"Yuji Syuku","Shippori Mincho B1","Hiragino Mincho ProN",serif;--sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--night)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--sans);color:var(--ink);overflow:hidden;height:100svh;background:var(--night)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
.view{position:fixed;inset:0;height:100svh;overflow:hidden;z-index:2}
.wrap{position:relative;height:100%;max-width:480px;margin:0 auto}

/* 夕暮れの境内（全画面の後ろに1枚） */
#scene{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#leaves{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#leaves i{position:absolute;top:-20px;width:11px;height:11px;background:#d9653a;border-radius:0 70% 0 70%;opacity:.75;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-60px,105svh) rotate(540deg)}}

/* ロード: 箱がカラカラ */
#loading{position:fixed;inset:0;z-index:90;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
#loading svg{width:84px;height:130px;animation:rattle .5s ease-in-out infinite;transform-origin:50% 30%}
@keyframes rattle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(3px)}}
#loading p{font-family:var(--min);font-size:15px;color:#f3e6cc;letter-spacing:.12em}
#loadBar{width:150px;height:4px;background:rgba(255,255,255,.14);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--shu);transition:width .2s}

#corner{position:fixed;top:max(6px,env(safe-area-inset-top));right:6px;z-index:60;display:flex;gap:6px}
#corner button{min-width:42px;height:42px;border-radius:21px;background:rgba(16,20,34,.55);color:#f3e6cc;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 10px}
#corner svg{width:20px;height:20px;fill:#f3e6cc}

/* タイトル */
#vTitle .wrap{display:flex;flex-direction:column;align-items:center;padding:calc(56px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.tMid{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:4vw}
.tSlip{position:relative;height:min(62svh,440px);aspect-ratio:1/2.3;background:var(--paper);box-shadow:0 14px 30px rgba(0,0,0,.45);transform:rotate(-2deg);padding:8% 0;display:flex;flex-direction:column;align-items:center;outline:2px solid var(--shu);outline-offset:-9px}
.tSlip::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:40px;background:#e9dcc0;transform:translateX(-50%)}
.tSlip h1{writing-mode:vertical-rl;font-family:var(--brush);font-weight:400;font-size:min(13vw,8.4svh,56px);line-height:1;letter-spacing:.06em;color:var(--ink)}
.tSlip h1 b{color:var(--shu);font-weight:400}
.tSlip.en{aspect-ratio:auto;width:min(60vw,250px);height:auto;padding:26px 14px}
.tSlip.en h1{writing-mode:horizontal-tb;font-family:var(--min);font-weight:800;font-size:min(9vw,40px);text-align:center;line-height:1.1}
.tBox{width:min(30vw,120px);position:relative;align-self:flex-end;margin-bottom:6svh;animation:idleRock 2.4s ease-in-out infinite;transform-origin:50% 20%}
@keyframes idleRock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.tBox svg{width:100%;display:block}
#tSub{font-family:var(--min);font-weight:600;color:#f6e7c8;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.6);margin:10px 0 12px;text-align:center}
#bStart{width:min(78vw,300px);min-height:56px;border-radius:4px;background:var(--shu);color:#fff6e6;font-family:var(--min);font-weight:800;font-size:20px;letter-spacing:.1em;box-shadow:0 5px 0 var(--shu2),0 10px 22px rgba(0,0,0,.4)}
#bStart:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shu2)}
.tLinks{display:flex;gap:22px;margin-top:6px}
.tLinks button{min-height:44px;padding:0 6px;color:#f3e6cc;font-family:var(--min);font-weight:600;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#tBest{font-size:12px;color:#d9c6a2;min-height:16px}

/* 遊び */
#vPlay .wrap{display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 10px 0}
#hud{flex:none;height:50px;display:flex;align-items:center;gap:10px;padding-right:100px}
#clock{display:flex;align-items:baseline;gap:6px;background:linear-gradient(#7a4f2c,#5d3a1e);color:#f6e3bd;padding:3px 10px 4px;border-radius:2px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
#clock small{font-size:10px;font-family:var(--min);font-weight:600;letter-spacing:.08em}
#clock b{font-family:var(--min);font-weight:800;font-size:26px;line-height:1;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
#clock.low b{color:#ffb39a}
#ema{position:relative;width:62px;height:44px;background:linear-gradient(#d8b07c,#b88a55);clip-path:polygon(50% 0,100% 26%,100% 100%,0 100%,0 26%);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:4px;color:var(--ink)}
#ema small{font-family:var(--brush);font-size:13px;color:var(--shu)}
#ema b{font-family:var(--min);font-weight:800;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
#ema.up{animation:emaUp .5s ease-out}
@keyframes emaUp{30%{transform:translateY(-4px) rotate(-6deg)}}
#thread{flex:none;position:relative;height:30px}
#thread svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#lvFlash{position:absolute;right:0;top:22px;font-family:var(--brush);font-size:15px;color:#ffd8c8;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .25s;white-space:nowrap}
#lvFlash.on{opacity:1}

#upper{flex:1;min-height:0;position:relative;display:flex;gap:6px;padding-top:4px}
#slipZone{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#rack{position:relative;width:30%;max-width:136px;flex:none;border-radius:6px}
#rack .post{position:absolute;top:8%;bottom:0;width:9px;background:linear-gradient(90deg,#5a3a1f,#8a5d36,#5a3a1f)}
#rack .post.l{left:8%}#rack .post.r{right:8%}
#rack .roof{position:absolute;left:0;right:0;top:3%;height:16px;background:linear-gradient(#4b2e18,#6c4426);clip-path:polygon(6% 100%,0 40%,50% 0,100% 40%,94% 100%)}
#rack .rope{position:absolute;left:8%;right:8%;height:3px;background:repeating-linear-gradient(90deg,#d8c39a 0 4px,#b9a074 4px 7px);box-shadow:0 1px 1px rgba(0,0,0,.4)}
#rack .knot{position:absolute;width:9px;height:15px;margin-left:-4px;margin-top:-6px;background:#efe7d6;border-radius:2px;transform:rotate(var(--r,0deg));box-shadow:0 1px 2px rgba(0,0,0,.35)}
#rack .knot.old{background:#cfc6b2;opacity:.8}
#rack .knot.mine{background:#fffaf0;outline:1.5px solid var(--shu)}
#rack .sign{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);writing-mode:vertical-rl;background:#e9d7b2;color:var(--ink);font-family:var(--brush);font-size:13px;padding:6px 3px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
#rack.want{box-shadow:0 0 0 2px rgba(255,214,120,.85),0 0 26px rgba(255,200,90,.45)}
#rack.want .sign{background:var(--shu);color:#fff6e6}
#rack .curse{position:absolute;left:50%;top:12%;transform:translateX(-50%);width:92%;background:#2b3a55;color:#fff;font-size:11px;font-weight:700;line-height:1.3;padding:3px 4px;border-radius:2px;text-align:center;z-index:2}
#rack .tieCount{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:5px}
#rack .tieCount i{width:10px;height:10px;border-radius:50%;border:2px solid #ffe0a0;background:transparent}
#rack .tieCount i.on{background:#ffe0a0}

/* くじ（開いた紙） */
#slip{position:relative;height:96%;max-height:360px;aspect-ratio:1/1.5;max-width:100%;background:var(--paper);box-shadow:0 10px 24px rgba(0,0,0,.45);padding:12px 10px;writing-mode:vertical-rl;display:flex;flex-direction:column;align-items:flex-start;gap:6px;outline:2px solid var(--shu);outline-offset:-6px;overflow:hidden;transform-origin:50% 0}
#slip::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(8deg,rgba(120,90,50,.035) 0 2px,transparent 2px 6px)}
#slip.in{animation:unfold .32s ease-out}
@keyframes unfold{0%{transform:scaleY(.15) rotate(-3deg);opacity:.4}100%{transform:none;opacity:1}}
#slip .sHead{display:flex;flex-direction:column;align-items:center;gap:4px;padding-left:6px;border-left:1.5px solid rgba(196,64,42,.5)}
#slip .sNo{font-family:var(--min);font-weight:600;font-size:11px;color:#6d5a44}
#slip .sRank{font-family:var(--brush);font-weight:400;font-size:min(10vw,6.2svh,44px);line-height:1;color:var(--shu)}
#slip .sCat{font-family:var(--min);font-weight:800;font-size:min(3.8vw,2.3svh,15px);color:#6d5a44;padding-top:4px}
#slip .sText{font-family:var(--min);font-weight:800;font-size:min(5.6vw,3.3svh,23px);line-height:1.5;color:var(--ink);padding-top:4px}
#slip .sText .tcy{text-combine-upright:all;-webkit-text-combine:horizontal}
#slip .sCurse{position:absolute;left:8px;bottom:8px;writing-mode:horizontal-tb;font-size:11px;font-weight:700;color:#fff;background:#2b3a55;padding:2px 6px;border-radius:2px}
#slip .stamp{position:absolute;left:8px;top:10px;writing-mode:horizontal-tb;width:34px;height:34px;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font-family:var(--brush);font-size:16px;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);opacity:.9}
#slip .stamp.gold{border-color:#b8862a;color:#b8862a;background:rgba(232,180,76,.15)}
#slip.bad{outline-color:#2b3a55;background:#ece6db}
#slip.bad .sRank{color:#2b3a55}
#slip.gone{animation:toRack .5s ease-in forwards}
@keyframes toRack{to{transform:translate(70%,-10%) scale(.08) rotate(20deg);opacity:0}}
#slip.pocket{animation:pocket .4s ease-in forwards}
@keyframes pocket{to{transform:translateY(60%) scale(.2) rotate(-30deg);opacity:0}}
#slip.tug{animation:tug .18s ease-out}
@keyframes tug{50%{transform:translateX(6%) rotate(3deg)}}
#slip.en{writing-mode:horizontal-tb;aspect-ratio:auto;width:min(100%,260px);height:auto;max-height:96%;padding:14px 16px 18px;gap:4px}
#slip.en .sHead{flex-direction:row;align-items:baseline;gap:8px;padding:0 0 6px;border-left:0;border-bottom:1.5px solid rgba(196,64,42,.5)}
#slip.en .sRank{font-family:var(--min);font-weight:800;font-size:min(7vw,30px)}
#slip.en .sText{font-size:min(5vw,3svh,20px);line-height:1.35}
#slip.en .sCurse{position:static;align-self:flex-start;margin-top:6px}
#slip.en .stamp{left:auto;right:10px;top:auto;bottom:8px;font-size:11px}
#slipEmpty{font-family:var(--min);font-weight:600;color:rgba(246,231,200,.55);font-size:14px;writing-mode:vertical-rl;letter-spacing:.3em}

#folded{position:absolute;left:50%;top:50%;width:62px;height:96px;margin:-48px 0 0 -31px;background:linear-gradient(115deg,#fbf6ea 0 48%,#e6dcc6 48% 52%,#f4ecda 52%);box-shadow:0 8px 16px rgba(0,0,0,.45);transform:rotate(-8deg);z-index:5;animation:drop .3s ease-out}
#folded::before{content:"";position:absolute;inset:-22px}
#folded::after{content:"";position:absolute;left:0;right:0;top:44%;height:10px;background:var(--shu)}
#folded.wait{animation:wiggle .35s ease-in-out}
@keyframes drop{0%{transform:translateY(120px) rotate(20deg) scale(.4)}100%{transform:rotate(-8deg)}}
@keyframes wiggle{25%{transform:rotate(-14deg)}75%{transform:rotate(2deg)}}

/* 箱まわり */
#lower{flex:none;position:relative;height:44svh;margin:0 -10px}
#counter{position:absolute;left:0;right:0;bottom:0;height:calc(15% + env(safe-area-inset-bottom));background:linear-gradient(#8a5a35,#6b4226 30%,#53321b);box-shadow:0 -3px 8px rgba(0,0,0,.35)}
#counter::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:#a46d43}
#price{position:absolute;right:14px;top:10px;font-family:var(--min);font-weight:800;font-size:12px;color:#f3dfb8;letter-spacing:.06em}
#boxBtn{position:absolute;left:50%;top:0;width:min(56vw,220px);height:66%;transform:translateX(-50%);z-index:4}
#boxArt{position:absolute;z-index:3;left:50%;top:0;height:72%;aspect-ratio:160/250;transform:translateX(-50%);transform-origin:50% 25%;pointer-events:none}
#boxArt svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#boxArt.shL{animation:shL .2s ease-out}
#boxArt.shR{animation:shR .2s ease-out}
@keyframes shL{40%{transform:translateX(-50%) rotate(-13deg) translateY(4px)}}
@keyframes shR{40%{transform:translateX(-50%) rotate(13deg) translateY(4px)}}
#boxArt.hot svg{filter:drop-shadow(0 0 10px rgba(255,120,60,.8)) drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#boxArt.jam{animation:jamA .5s ease-in-out}
@keyframes jamA{20%{transform:translateX(-50%) rotate(8deg)}40%{transform:translateX(-50%) rotate(-6deg)}60%{transform:translateX(-50%) rotate(4deg)}}
#boxArt.nope{animation:nope .25s}
@keyframes nope{50%{transform:translateX(-47%)}}
#prog{position:absolute;left:calc(50% + min(15vw,62px));top:14%;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:4}
#prog i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(255,230,180,.5)}
#prog i.on{background:#f3d79a}
#jamTag{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) rotate(-8deg);z-index:6;font-family:var(--brush);font-size:28px;color:#fff;background:var(--shu);padding:2px 12px;pointer-events:none}

#stickWrap{position:absolute;left:50%;top:60%;width:90px;height:32%;transform:translateX(-50%);z-index:5;display:flex;justify-content:center;pointer-events:none}
#stick{position:relative;width:90px;height:100%;pointer-events:none;transform:translateY(-45%);transition:transform .16s ease-out,opacity .1s;opacity:0}
#stick.out{transform:none;opacity:1;pointer-events:auto}
#stick svg{position:relative;height:100%;width:auto;display:block;margin:0 auto;z-index:1}
#halo{position:absolute;left:50%;top:55%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.95) 0,rgba(255,196,90,.55) 32%,rgba(255,170,60,0) 68%);opacity:var(--g,0);transform:scale(calc(.55 + var(--g,0) * .6));pointer-events:none}
#stick.gold #halo{background:radial-gradient(circle,rgba(255,250,210,1) 0,rgba(255,215,90,.8) 30%,rgba(255,190,40,0) 70%)}
#spark{position:absolute;inset:-30px;pointer-events:none;opacity:0}
#stick.gold #spark{opacity:1}
#spark i{position:absolute;width:6px;height:6px;background:#fff6c8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 0.7s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1.4);opacity:1}}

.char{position:absolute;bottom:13%;pointer-events:none;z-index:7}
.char svg{display:block;height:100%;width:auto;filter:drop-shadow(1.4px 0 0 #2b1d16) drop-shadow(-1.4px 0 0 #2b1d16) drop-shadow(0 1.4px 0 #2b1d16) drop-shadow(0 -1.4px 0 #2b1d16) drop-shadow(0 6px 6px rgba(0,0,0,.35))}
#priest{left:-6%;height:62%;transform:translateX(-80%);transition:transform .25s ease-out}
#priest.peek{transform:translateX(-46%)}
#priest.out{transform:translateX(8%)}
#ex{left:50%;height:80%;z-index:8;pointer-events:auto;transform:translateX(-50%);display:flex;align-items:flex-end}
#ex.walk{animation:exIn .35s ease-out}
@keyframes exIn{from{transform:translateX(60%);opacity:0}}
#ex.push{animation:exPush .18s ease-out}
@keyframes exPush{50%{transform:translateX(-36%) rotate(4deg)}}
#ex .tag{position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:11px;font-weight:700;padding:1px 6px;border-radius:2px;white-space:nowrap}
#ex .partner{display:none;margin-left:-28px}
#ex.plus .partner{display:block}
#ex .hp{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);display:flex;gap:3px}
#ex .hp i{width:8px;height:8px;background:#fff;border-radius:50%;opacity:.9}
.lady{display:none}#ex.k1 .lady{display:inline}#ex.k1 .guy{display:none}

#crow{position:absolute;right:calc(30% * .5 - 34px);top:-2px;width:68px;height:56px;z-index:9;pointer-events:auto}
#crow svg{width:100%;height:100%;display:block}
#crow.in{animation:crowIn .45s ease-out}
@keyframes crowIn{from{transform:translate(80px,-80px) rotate(20deg);opacity:0}}
#crow.shoo{animation:crowShoo .2s}
@keyframes crowShoo{50%{transform:translateY(-10px) rotate(-10deg)}}
#crow.steal{animation:crowSteal .7s ease-in forwards}
@keyframes crowSteal{40%{transform:translate(calc(-1 * var(--dx,120px)),var(--dy,80px)) scale(1.2)}100%{transform:translate(-120vw,-40svh)}}
#crow .two{display:none}#crow.two .two{display:block}

#bubble{position:absolute;z-index:12;max-width:70%;background:#fffaf0;border:2px solid var(--ink);border-radius:14px;padding:5px 12px;font-family:var(--min);font-weight:800;font-size:15px;line-height:1.3;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
#bubble.on{opacity:1}
#hint{position:fixed;z-index:11;background:#f6edd8;color:var(--ink);font-family:var(--min);font-weight:800;font-size:14px;padding:5px 12px 6px;border-left:4px solid var(--shu);box-shadow:0 3px 8px rgba(0,0,0,.4);transform:rotate(-1.5deg);white-space:nowrap;pointer-events:none}
#finger{position:absolute;z-index:13;width:40px;height:40px;pointer-events:none;animation:poke .8s ease-in-out infinite}
@keyframes poke{50%{transform:translate(4px,8px) scale(.92)}}

#curtain{position:fixed;inset:0;z-index:40;background:rgba(10,12,22,.0);pointer-events:none;transition:background .6s}
#curtain.on{background:rgba(10,12,22,.55);pointer-events:auto}
#closeTxt{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:41;font-family:var(--brush);font-size:min(12vw,52px);color:#fff3dc;writing-mode:vertical-rl;letter-spacing:.2em;text-shadow:0 2px 10px #000}

/* 結果 */
#vEnd .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:calc(50px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
#cardBox{flex:0 1 auto;min-height:0;height:calc(100svh - 268px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:560px;aspect-ratio:1080/1350;max-width:100%;display:flex;align-items:center;justify-content:center}

.endBtns{flex:none;display:flex;flex-direction:column;gap:6px;width:min(100%,380px)}
.endBtns .row{display:flex;gap:6px}
.endBtns button{flex:1;min-height:44px;border-radius:4px;font-family:var(--min);font-weight:800;font-size:15px;background:#f3e6cc;color:var(--ink)}
.endBtns .row:first-child button,#bBook2{background:rgba(16,20,34,.55);color:#f3e6cc;border:1px solid rgba(243,230,204,.5)}
#bAgain{background:var(--shu);color:#fff6e6;box-shadow:0 4px 0 var(--shu2)}
#affBox{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
#bAff{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;max-width:100%;padding:0 14px;border-radius:4px;border:1px solid rgba(243,230,204,.45);color:#f3e6cc;font-size:14px;font-weight:700;text-decoration:none;line-height:1.25}
#bAff .pr{flex:none;font-size:13px;font-weight:700;border:1.5px solid #f3e6cc;border-radius:3px;padding:0 5px;line-height:1.45}
#affNote{font-size:11px;color:#cdbb98}

/* 図鑑・遊び方 */
.ovl{position:fixed;inset:0;z-index:70;background:#10141f;display:flex;flex-direction:column;padding:calc(54px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));color:#f3e6cc}
.ovl .in{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
.ovl h2{font-family:var(--min);font-weight:800;font-size:20px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.ovl h2 span{font-size:13px;font-weight:600;color:#cdbb98}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(10,minmax(0,1fr));gap:4px}
.cell{position:relative;min-height:0;background:#f3ead6;color:var(--ink);border-radius:2px;display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--min);font-weight:800;font-size:13px;line-height:1}
.cell small{font-size:10px;font-weight:600;color:#6d5a44}
.cell.lock{background:rgba(243,234,214,.12);color:rgba(243,234,214,.4)}
.cell.rare{outline:2px solid var(--gold);outline-offset:-2px}
.cell.bad{background:#d9d3c8}
.cell.sel{box-shadow:0 0 0 2px #fff}
#bookInfo{flex:none;min-height:58px;margin-top:8px;font-family:var(--min);font-weight:600;font-size:14px;line-height:1.45}
#howBody{flex:1;min-height:0;overflow:hidden;font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:12px}
#howBody b{color:var(--gold)}
#howBody small{font-size:11px;line-height:1.5;color:#b8a888;margin-top:auto}
#howBody a{color:#cfe0f0}
.ovl .close{flex:none;margin-top:10px;min-height:46px;border-radius:4px;background:#f3e6cc;color:var(--ink);font-family:var(--min);font-weight:800;font-size:16px}
@media (max-height:680px){#hud{height:44px}#clock b{font-size:22px}#ema{height:38px;width:56px}#thread{height:24px}#lvFlash{top:16px}}

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  // 読み込み中を失敗と出さない: JS が動いたか（__jsUp）で見る
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
